name: Vetogram Verification
on:
  push:
    branches: [main, feat/vetogram-reborn-auth-and-navigation-20261025]
  pull_request:
    branches: [main, feat/vetogram-4-experience-implementation-20261025]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify dependency lock integrity
        run: npm run lock:check
      - run: npm ci --no-audit --no-fund
      - run: npm run vercel-build
