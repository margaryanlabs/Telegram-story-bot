name: Vetogram Verification
# ZERO-COST MODE: GitHub-hosted runners currently require owner billing.
# Do not request runners on branch pushes or draft PR updates.
# An authorized maintainer may trigger this workflow manually after
# Actions becomes available; no secrets or Telegram sessions are required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify dependency lock integrity
        run: npm run lock:check
      - run: npm ci --no-audit --no-fund
      - run: npm run vercel-build
