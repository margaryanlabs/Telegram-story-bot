<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>VETOGRAM — проверка экранов</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#070a11;color:#dde7f6;font:13px system-ui,sans-serif}
    header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #263550}
    strong{font-size:14px}button,select{min-height:38px;border:1px solid #263550;border-radius:8px;background:#111a2b;color:#dde7f6;padding:8px 10px;font:inherit}
    button[aria-pressed=true]{background:#ff7887;color:#070a11}button:focus-visible,select:focus-visible{outline:2px solid #ff7887;outline-offset:2px}
    label{display:flex;align-items:center;gap:8px}main{padding:20px;min-width:max-content;display:flex;justify-content:center}
    iframe{display:block;border:1px solid #263550;border-radius:14px;background:#070a11;width:390px;height:844px}
    p{margin:0;color:#a0afc8;font-size:11px}#sizes{display:flex;gap:4px;flex-wrap:wrap}
  </style>
</head>
<body>
  <header><strong>VETOGRAM · проверка экранов</strong><div id="sizes" role="group" aria-label="Ширина приложения">
    <button data-width="320" aria-pressed="false">320</button><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="true">390</button><button data-width="430" aria-pressed="false">430</button><button data-width="725" aria-pressed="false">Fold 725</button><button data-width="768" aria-pressed="false">768</button><button data-width="1024" aria-pressed="false">1024</button><button data-width="1440" aria-pressed="false">1440</button>
  </div><label>Раздел<select id="screen"><option value="home">Главная</option><option value="telegram">Чаты</option><option value="publish">Истории</option><option value="privacy">Защита</option><option value="story-engine">Студия</option><option value="voice">Голос</option><option value="ai">ИИ</option></select></label>
  <p>Настоящий Mini App в отдельном viewport. Данных и поддельной Telegram-сессии нет. Для живых интеграций нужен Telegram.</p></header>
  <main><iframe id="app" src="/studio.html?screen=home" title="VETOGRAM — реальное приложение" allow="autoplay"></iframe></main>
  <script>
    const frame=document.getElementById('app');
    document.getElementById('sizes').addEventListener('click',event=>{
      const button=event.target.closest('[data-width]');if(!button)return;
      document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      frame.style.width=button.dataset.width+'px';frame.style.height=Number(button.dataset.width)>700?'820px':'844px';
    });
    document.getElementById('screen').addEventListener('change',event=>{
      const target=event.target.value;
      if(typeof frame.contentWindow?.VetoTelegramNavigate==='function')frame.contentWindow.VetoTelegramNavigate(target);
      else frame.src='/studio.html?screen='+encodeURIComponent(target);
    });
  </script>
</body>
</html>
