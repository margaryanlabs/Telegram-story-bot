<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Story Pilot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: var(--tg-theme-bg-color,#111827);
      color: var(--tg-theme-text-color,#fff);
      text-align: center;
    }
    .wrap { width: min(100%,380px); }
    .icon { font-size: 44px; margin-bottom: 12px; }
    h1 { margin: 0 0 10px; font-size: 25px; }
    p { margin: 0; color: var(--tg-theme-hint-color,#9ca3af); line-height: 1.45; }
    button {
      margin-top: 22px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 700;
      background: var(--tg-theme-button-color,#2ea6ff);
      color: var(--tg-theme-button-text-color,#fff);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="icon">🚀</div>
    <h1>Открываю Story Pilot</h1>
    <p>Возвращаю тебя в чат с кнопками аудитории и публикации.</p>
    <button id="back">Вернуться в Story Pilot</button>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    function goHome() {
      if (!tg) return;
      try { tg.sendData('storypilot:home'); } catch (_) {}
      setTimeout(() => { try { tg.close(); } catch (_) {} }, 120);
    }
    if (tg) {
      tg.ready();
      document.getElementById('back').addEventListener('click', goHome);
      setTimeout(goHome, 180);
    }
  </script>
</body>
</html>
